<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="960" height="780" fill="#f8f9fa" rx="12"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CLIENT SECTION -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="20" width="480" height="110" rx="12" fill="none" stroke="#7c4a1e" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="36" y="42" font-size="13" font-weight="bold" fill="#7c4a1e">👤 Client</text>

  <!-- Android App box -->
  <rect x="60" y="52" width="200" height="65" rx="10" fill="#fff8f0" stroke="#c47a2a" stroke-width="2"/>
  <text x="80" y="74" font-size="11" fill="#555">🤖</text>
  <text x="100" y="76" font-size="13" font-weight="bold" fill="#333">Android App</text>
  <text x="100" y="94" font-size="11" fill="#666">Kotlin · Jetpack Compose</text>
  <text x="100" y="109" font-size="10" fill="#888">OkHttp · ViewModel</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- DOCKER-COMPOSE SECTION -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="150" width="670" height="510" rx="12" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="36" y="172" font-size="13" font-weight="bold" fill="#2563eb">🐳 Docker Compose  (로컬 PC · EC2)</text>

  <!-- FastAPI box -->
  <rect x="50" y="185" width="610" height="450" rx="10" fill="#f0f7ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="208" font-size="13" font-weight="bold" fill="#1d4ed8">⚡ FastAPI  :8000</text>
  <text x="200" y="208" font-size="11" fill="#555">· JWT 인증  · REST API  · AI 파이프라인</text>

  <!-- API Routes label -->
  <text x="70" y="235" font-size="11" font-weight="bold" fill="#475569">API Routes</text>

  <!-- Route chips row 1 -->
  <rect x="68" y="243" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="107" y="262" font-size="11" fill="#1e40af" text-anchor="middle">auth</text>

  <rect x="154" y="243" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="193" y="262" font-size="11" fill="#1e40af" text-anchor="middle">sessions</text>

  <rect x="240" y="243" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="279" y="262" font-size="11" fill="#1e40af" text-anchor="middle">voice</text>

  <rect x="326" y="243" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="262" font-size="11" fill="#1e40af" text-anchor="middle">chapters</text>

  <rect x="412" y="243" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="451" y="262" font-size="11" fill="#1e40af" text-anchor="middle">book</text>

  <!-- Route chips row 2 -->
  <rect x="68" y="279" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="107" y="298" font-size="11" fill="#1e40af" text-anchor="middle">feed</text>

  <rect x="154" y="279" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="193" y="298" font-size="11" fill="#1e40af" text-anchor="middle">chat</text>

  <rect x="240" y="279" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="279" y="298" font-size="11" fill="#1e40af" text-anchor="middle">memory</text>

  <rect x="326" y="279" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="298" font-size="11" fill="#1e40af" text-anchor="middle">safety</text>

  <rect x="412" y="279" width="78" height="28" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="451" y="298" font-size="11" fill="#1e40af" text-anchor="middle">messages</text>

  <!-- Divider -->
  <line x1="68" y1="322" x2="640" y2="322" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Services Layer label -->
  <text x="70" y="342" font-size="11" font-weight="bold" fill="#475569">Services Layer</text>

  <!-- Service boxes -->
  <!-- STT -->
  <rect x="68" y="350" width="120" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="128" y="370" font-size="20" text-anchor="middle">🎙️</text>
  <text x="128" y="390" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">STT Service</text>
  <text x="128" y="407" font-size="10" fill="#555" text-anchor="middle">음성 → 텍스트</text>

  <!-- TTS -->
  <rect x="200" y="350" width="120" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="260" y="370" font-size="20" text-anchor="middle">🔊</text>
  <text x="260" y="390" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">TTS Service</text>
  <text x="260" y="407" font-size="10" fill="#555" text-anchor="middle">텍스트 → 음성</text>

  <!-- Text Gen -->
  <rect x="332" y="350" width="130" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="397" y="370" font-size="20" text-anchor="middle">✍️</text>
  <text x="397" y="390" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">TextGen Service</text>
  <text x="397" y="407" font-size="10" fill="#555" text-anchor="middle">인터뷰 AI 응답</text>

  <!-- Chapter Gen -->
  <rect x="474" y="350" width="130" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="539" y="370" font-size="20" text-anchor="middle">📖</text>
  <text x="539" y="390" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Chapter Service</text>
  <text x="539" y="407" font-size="10" fill="#555" text-anchor="middle">챕터 생성·편집</text>

  <!-- Memory -->
  <rect x="68" y="432" width="120" height="68" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="128" y="452" font-size="20" text-anchor="middle">🧠</text>
  <text x="128" y="472" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">Memory Service</text>
  <text x="128" y="489" font-size="10" fill="#555" text-anchor="middle">사용자 기억 추출</text>

  <!-- Safety -->
  <rect x="200" y="432" width="120" height="68" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="260" y="452" font-size="20" text-anchor="middle">🛡️</text>
  <text x="260" y="472" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">Safety Service</text>
  <text x="260" y="489" font-size="10" fill="#555" text-anchor="middle">콘텐츠 안전 검사</text>

  <!-- Feed -->
  <rect x="332" y="432" width="130" height="68" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="397" y="452" font-size="20" text-anchor="middle">📰</text>
  <text x="397" y="472" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">Feed Service</text>
  <text x="397" y="489" font-size="10" fill="#555" text-anchor="middle">피드 분석·생성</text>

  <!-- Book -->
  <rect x="474" y="432" width="130" height="68" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="539" y="452" font-size="20" text-anchor="middle">📚</text>
  <text x="539" y="472" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">Book Service</text>
  <text x="539" y="489" font-size="10" fill="#555" text-anchor="middle">챕터 → 책 편집</text>

  <!-- Auth note inside FastAPI -->
  <rect x="68" y="516" width="610" height="30" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="373" y="535" font-size="11" fill="#3730a3" text-anchor="middle">🔑  Supabase JWT 검증  ·  anon key / service_role key 분리 사용</text>

  <!-- Audio volume mount note -->
  <rect x="68" y="554" width="610" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="373" y="571" font-size="11" fill="#64748b" text-anchor="middle">📁  Volume: storyvenue_generated_audio  (TTS MP3 파일 캐시 · 24h 보관)</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- EXTERNAL SERVICES (right column) -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Supabase box -->
  <rect x="710" y="150" width="230" height="210" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="826" y="172" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="middle">☁️ Supabase</text>

  <rect x="730" y="182" width="190" height="42" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="825" y="198" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">🗄️  PostgreSQL</text>
  <text x="825" y="214" font-size="10" fill="#555" text-anchor="middle">users · sessions · chapters · books</text>

  <rect x="730" y="232" width="190" height="42" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="825" y="248" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">🔐  Auth</text>
  <text x="825" y="264" font-size="10" fill="#555" text-anchor="middle">회원가입 · 로그인 · JWT 발급</text>

  <rect x="730" y="282" width="190" height="42" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="825" y="298" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">📦  Storage</text>
  <text x="825" y="314" font-size="10" fill="#555" text-anchor="middle">feed · chat 파일 저장</text>

  <!-- OpenAI box -->
  <rect x="710" y="380" width="230" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="826" y="402" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">🤖 OpenAI API</text>

  <rect x="730" y="412" width="190" height="36" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="825" y="424" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">gpt-4o-transcribe</text>
  <text x="825" y="440" font-size="10" fill="#555" text-anchor="middle">음성 → 텍스트 (STT)</text>

  <rect x="730" y="456" width="190" height="36" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="825" y="468" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">gpt-4o-mini-tts</text>
  <text x="825" y="484" font-size="10" fill="#555" text-anchor="middle">텍스트 → 음성 (TTS)</text>

  <rect x="730" y="500" width="190" height="36" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="825" y="512" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">gpt-4.1-mini</text>
  <text x="825" y="528" font-size="10" fill="#555" text-anchor="middle">챕터·메모리·피드·안전 생성</text>

  <rect x="730" y="544" width="190" height="22" rx="6" fill="#bbf7d0" stroke="#86efac" stroke-width="1"/>
  <text x="825" y="558" font-size="10" fill="#166534" text-anchor="middle">voice · coral  (TTS 보이스)</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROWS -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Android → FastAPI -->
  <line x1="160" y1="117" x2="160" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="168" y="152" font-size="10" fill="#64748b">HTTP/REST</text>

  <!-- FastAPI → Supabase -->
  <line x1="660" y1="310" x2="708" y2="280" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrP)"/>
  <text x="662" y="300" font-size="10" fill="#9333ea">DB / Auth</text>

  <!-- FastAPI → OpenAI -->
  <line x1="660" y1="430" x2="708" y2="450" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <text x="662" y="455" font-size="10" fill="#16a34a">AI API</text>

  <!-- Android auth → Supabase (direct) -->
  <line x1="260" y1="84" x2="710" y2="210" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrP)"/>
  <text x="480" y="130" font-size="10" fill="#9333ea">Auth (직접 로그인)</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- DATA FLOW LEGEND -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="20" y="680" width="670" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="700" font-size="12" font-weight="bold" fill="#334155">데이터 흐름</text>

  <text x="34" y="720" font-size="11" fill="#475569">① 앱 실행  →  Supabase Auth 로그인  →  JWT 토큰 발급</text>
  <text x="34" y="737" font-size="11" fill="#475569">② 음성 녹음  →  FastAPI /voice/turn  →  STT(gpt-4o-transcribe)  →  AI 응답(gpt-4.1-mini)  →  TTS(gpt-4o-mini-tts)  →  앱 재생</text>
  <text x="34" y="754" font-size="11" fill="#475569">③ 챕터 생성  →  /chapters/generate  →  LLM  →  Supabase 저장  →  /book/compile  →  피드 게시</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

</svg>
